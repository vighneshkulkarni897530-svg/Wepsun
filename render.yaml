services:
  - type: web
    name: wepsun-backend-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx backend/src/server.ts
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: "wepsunengineering@gmail.com"
      - key: SMTP_PASS
        value: "fmkb jubm qyac tuwt"
      - key: SMTP_FROM
        value: "WEPSUN Engineering <wepsunengineering@gmail.com>"
